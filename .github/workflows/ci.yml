name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Catalog, generated indexes and dataset contracts
        run: |
          pip install -r requirements-catalog.txt
          python tools/generate_catalog.py --check
          python tools/validate_contracts.py
          python tools/check_markdown_links.py
      - name: Sample application
        working-directory: applications/cvat-b2-dataset-pipeline
        run: |
          pip install -r requirements-dev.txt -e .
          python -m pytest
      - name: CVAT attach script
        working-directory: infrastructure/cvat
        run: pip install pytest && python -m pytest
      - name: Example configs are valid JSON
        run: for f in examples/*.json manifests/*.json schemas/*.json testdata/*/croissant.json codemeta.json; do python -m json.tool "$f" >/dev/null; done
